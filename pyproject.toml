[project]
name = "fotoorganizer"
version = "0.1.0"
description = "Catalogador e organizador assistido de fotos, local e não destrutivo (macOS)"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "Pillow>=11.0",
    "pillow-heif>=0.20",
    "rawpy>=0.27",
    "exifread>=3.0",
    "ImageHash>=4.3",
    "xxhash>=3.4",
    "reverse-geocode>=1.6",
    "cryptography>=42.0",
    # Servidor local da UI web (escuta só em 127.0.0.1; docs/ARQUITETURA.md)
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "httpx>=0.27",
]
# Advisor de classificação via Claude (opt-in; docs/AGRUPAMENTO.md §3)
llm = [
    "anthropic>=0.116",
]
# Importador do Apple Fotos (opt-in; leitura local da biblioteca)
apple = [
    "osxphotos>=0.70",
]

[project.scripts]
fotoorganizer = "fotoorganizer.app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fotoorganizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
